<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>北京楼盘地图展示</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
  }

  /* 导航栏 */
  .nav {
    display: flex;
    background: #2d4a77;
  }

  .nav button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .nav button.active,
  .nav button:hover {
    background: #406299;
  }

  /* 地图 */
  #map {
    width: 100%;
    height: 450px;
  }

  /* 楼盘信息 */
  .info {
    padding: 20px;
    font-size: 15px;
    line-height: 1.7;
  }

  .info h3 {
    margin-bottom: 10px;
    color: #2d4a77;
  }
</style>
</head>

<body>
<!-- 导航栏 -->
<div class="nav">
  <button class="active" data-key="jiatang">嘉棠雅序</button>
  <button data-key="zhaoshang">招商玺</button>
  <button data-key="zijin">紫金宸园</button>
  <button data-key="senyu">森屿文华</button>
</div>

<!-- 地图 -->
<div id="map"></div>

<!-- 楼盘信息 -->
<div class="info" id="info"></div>

<script>
// 1. 初始化地图（北京中心）
const map = L.map('map').setView([39.9042, 116.4074], 11);

// 加载高德底图
L.tileLayer('https://webst02.is.autonavi.com/appmaptile?style=7&x={x}&y={y}&z={z}', {
  attribution: '&copy; 高德地图'
}).addTo(map);

// ======================================
// 北京真实楼盘数据（坐标+详细介绍）
// ======================================
const buildings = {
  jiatang: {
    name: "嘉棠雅序",
    lat: 39.836284,
    lng: 116.321742,
    info: `📍 位置：北京市丰台区玉泉营街道（樊家村路与芳菲路交叉口东南角）<br>
            🏠 开发商：北京建工+北京城乡建设（双央企）<br>
            🏗 产品：11栋（3栋18F小高层+8栋洋房），约540户<br>
            🚇 地铁：房山线花乡东桥站约600米、10号线首经贸站约850米<br>
            ✅ 特色：南四环内稀缺低密、高得房率90%+、三甲天坛医院旁`
  },
  zhaoshang: {
    name: "招商玺（亦玺佳苑）",
    lat: 39.752703,
    lng: 116.501535,
    info: `1.🏗品牌与物业<br>
顶级央企背书，由招商蛇口开发，隶属招商局集团，打造城市顶奢专属产品线，遵循“一城一玺”定位，每城仅一席，稀缺收藏属性拉满。<br>
配套招商物业，服务品质稳居行业前三，依托招商集团多元资源，为业主提供专属VIP定制服务，打造精细化、高阶化专属居住服务体系，圈层质感纯粹。<br>
          2.📍区位与配套<br>
坐落亦庄核心高新板块，国家级高科技产业基地加持，区域人均GDP、高薪人才密度位居前列，高税收赋能优质城市环境，整体基建标准远超普通片区。<br>
教育配套顶配，拥有小初一贯制学区，锁区优先就读，紧邻亦庄实验中学、北京二中名校，办学条件优质、教育内卷度低。<br>
商业、生态、医疗完善，坐拥龙湖天街商圈，毗邻超大南海子公园、沿河景观带，户外休闲配套齐全；汇聚五环外密集三甲医院集群及区域最大儿童医院。<br>
交通持续升级，现有出行便捷度良好，地铁8号线南延规划落地后，将全面补齐板块交通短板。<br>
          3.✅社区与公区品质<br>
高端山水园林社区，打造一轴三庭九境十二幕立体景观，遵循明堂聚水优质风水格局，配置飞瀑、喷泉水系景观，搭配儿童乐园、水乐园等全龄休闲场景。<br>
居住舒适度极高，主流层高3.1米、3.15米，65-95米超宽楼间距，实现全天无遮挡采光、通透视野。<br>
高端私密梯户配比，多数楼栋一梯一户，140㎡户型采用两梯两户设计，私密性与居住舒适度拉满。<br>
公区质感标杆，外立面采用蓝眼睛石材玻璃幕，搭配画框造型与灯光勾边；打造劳斯莱斯星空顶七星级地库，全屋石材公区铺装，质感恒久耐用。<br>
          4.✅户型与产品亮点<br>
纯高端改善大平层社区，户型格局方正、动静分区合理，全系适配高阶改善、终极置业人群。<br>
主力户型涵盖144㎡经典四叶草、180㎡升级版大四叶草、266㎡顶奢大平层，全系采光通透、空间利用率高。<br>
266㎡旗舰户型优势突出，实现南向四面宽，搭配98㎡超大客厅、45㎡主卧套房，尺度比肩同级豪宅标杆。<br>
精装标准高端，全屋标配大金中央空调，用料扎实、工艺精湛，是亦庄板块稀缺顶奢人居标杆。`
  },
  zijin: {
    name: "紫金宸园（紫京宸园）",
    lat: 39.932500,
    lng: 116.453200,
    info: `📍 位置：北京市朝阳区黄杉木店路与朝阳北路交汇东北侧（朝青板块）<br>
            🏠 开发商：中建智地（央企）<br>
            🏗 产品：高层改善住宅，114-400㎡大平层<br>
            🚇 地铁：6号线青年路站约900米、22号线甘露园站约1.2公里<br>
            ✅ 特色：东四环星河湾旁、近朝阳大悦城、百万方公园环伺`
  },
  senyu: {
    name: "森屿文华（京投发展）",
    lat: 39.957784,
    lng: 116.463122,
    info: `📍 位置：北京市朝阳区东坝北西区（地铁12号线东坝西站东北约500米）<br>
            🏠 开发商：京投发展（国企）<br>
            🏗 产品：板楼+小高层，约696户，容积率1.79<br>
            🚇 地铁：12号线东坝西站约265米、3号线换乘站<br>
            ✅ 特色：双地铁、北京中学旁、56万㎡超级大盘、坝河/北小河双水系`
  }
};

// 存储所有标记点
let markers = {};
for (let key in buildings) {
  const item = buildings[key];
  markers[key] = L.marker([item.lat, item.lng]).addTo(map);
  markers[key].bindPopup(`<b>${item.name}</b>`);
}

// 当前激活的楼盘
let currentKey = "jiatang";

// 显示楼盘信息
function showInfo(key) {
  const item = buildings[key];
  document.getElementById("info").innerHTML = `
    <h3>${item.name}</h3>
    <p>${item.info}</p>
  `;
}

// 切换楼盘
function switchBuilding(key) {
  currentKey = key;
  const item = buildings[key];
  
  // 地图平滑飞到对应楼盘（缩放15，清晰看周边）
  map.flyTo([item.lat, item.lng], 15);
  
  // 打开标记弹窗
  markers[key].openPopup();
  
  // 显示详情
  showInfo(key);
  
  // 导航高亮
  document.querySelectorAll(".nav button").forEach(btn => btn.classList.remove("active"));
  document.querySelector(`[data-key="${key}"]`).classList.add("active");
}

// 初始化显示第一个楼盘
showInfo("jiatang");

// 绑定导航点击事件
document.querySelectorAll(".nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    const key = btn.getAttribute("data-key");
    switchBuilding(key);
  });
});
</script>
</body>
</html>
