<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>北京楼盘地图展示</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
  }

  /* 导航栏 */
  .nav {
    display: flex;
    background: #2d4a77;
  }

  .nav button {
    flex: 1;
    padding: 14px;
    border: none;
    background: transparent;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .nav button.active,
  .nav button:hover {
    background: #406299;
  }

  /* 地图 */
  #map {
    width: 100%;
    height: 450px;
  }

  /* 楼盘信息 —— 双图+文字布局 */
  .info {
    padding: 20px;
    font-size: 15px;
    line-height: 1.8;
    display: flex;
    gap: 25px;
    align-items: flex-start;
  }
  /* 双图容器 */
  .building-img-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 300px;
  }
  /* 单张图片样式 */
  .building-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  /* 文字区域 */
  .info-text {
    flex: 1;
  }

  .info h3 {
    margin-bottom: 10px;
    color: #2d4a77;
  }
  .img-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  }
  .img-desc {
  font-size: 14px;
  color: #2d4a77;
  font-weight: 500;
  margin: 0;
  }
</style>
</head>

<!-- 地图 -->
<div id="map"></div>

<!-- 楼盘信息 -->
<div class="info" id="info"></div>

// 地图标记
let markers = {};
for (let key in buildings) {
  const item = buildings[key];
  markers[key] = L.marker([item.lat, item.lng]).addTo(map);
  markers[key].bindPopup(`<b>${item.name}</b>`);
}

let currentKey = "jiatang";

// 展示信息
function showInfo(key) {
  const item = buildings[key];
  document.getElementById("info").innerHTML = `
    <h3>${item.name}</h3>
    <p>${item.info}</p>
  `;
}

// 切换楼盘
function switchBuilding(key) {
  currentKey = key;
  const item = buildings[key];
  map.flyTo([item.lat, item.lng], 15);
  markers[key].openPopup();
  showInfo(key);
  document.querySelectorAll(".nav button").forEach(btn => btn.classList.remove("active"));
  document.querySelector(`[data-key="${key}"]`).classList.add("active");
}

// 初始化
showInfo("jiatang");

// 绑定点击
document.querySelectorAll(".nav button").forEach(btn => {
  btn.addEventListener("click", () => {
    switchBuilding(btn.getAttribute("data-key"));
  });
});
</script>
</body>
</html>
